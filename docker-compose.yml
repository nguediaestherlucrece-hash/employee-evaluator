version: '3.9'

services:
  # ================================
  # Base de données PostgreSQL
  # ================================
  db:
    image: postgres:16-alpine
    container_name: evaldb
    environment:
      POSTGRES_DB: evaluatordb
      POSTGRES_USER: evaluator_user
      POSTGRES_PASSWORD: EvalPro@2024!
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evaluator_user -d evaluatordb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================================
  # Application Spring Boot
  # ================================
  app:
    build: .
    container_name: evalapp
    ports:
      - "8080:8080"
    environment:
      # === OBLIGATOIRE: Votre clé GROQ ===
      GROQ_API_KEY: ${GROQ_API_KEY}

      # Base de données
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/evaluatordb
      SPRING_DATASOURCE_USERNAME: evaluator_user
      SPRING_DATASOURCE_PASSWORD: EvalPro@2024!
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_H2_CONSOLE_ENABLED: "false"

      # Sécurité app
      APP_ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@2024!}

      # Upload
      APP_UPLOAD_DIR: /app/uploads/cvs
    volumes:
      - cv_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  cv_uploads:
