# ================================
# APPLICATION CONFIG
# ================================
spring.application.name=employee-evaluator
server.port=8080

# ================================
# BASE DE DONNÉES - DEV (H2)
# ================================
spring.datasource.url=jdbc:h2:mem:evaluatordb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ================================
# BASE DE DONNÉES - PROD (PostgreSQL)
# Décommenter pour la production
# ================================
# spring.datasource.url=jdbc:postgresql://localhost:5432/evaluatordb
# spring.datasource.username=evaluator_user
# spring.datasource.password=votre_mot_de_passe
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ================================
# JPA / HIBERNATE
# ================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ================================
# UPLOAD FICHIERS (CVs)
# ================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads/cvs

# ================================
# API GROQ (GRATUIT - https://console.groq.com)
# ================================
groq.api.key=${GROQ_API_KEY:your-groq-api-key-here}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama3-70b-8192
groq.max-tokens=4096

# ================================
# SÉCURITÉ
# ================================
app.admin.username=admin
app.admin.password=Admin@2024!

# ================================
# THYMELEAF
# ================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ================================
# LOGS
# ================================
logging.level.com.evaluator=DEBUG
logging.level.org.springframework.security=INFO
