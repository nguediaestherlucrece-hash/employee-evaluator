<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: title"><title>Historique</title></head>
<body>
<div th:replace="fragments/layout :: layout(~{::section})">
<section>
    <h2 class="mb-4"><i class="fas fa-history me-2 text-primary"></i>Historique des évaluations</h2>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>#</th><th>Employé</th><th>Poste</th><th>Département</th>
                        <th>Examinateur</th><th>Score</th><th>Niveau</th><th>Date</th>
                        <th>Statut</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="session : ${sessions}">
                        <td th:text="${session.id}">-</td>
                        <td th:text="${session.employee.fullName}">-</td>
                        <td th:text="${session.employee.poste}">-</td>
                        <td th:text="${session.employee.departement ?: '-'}">-</td>
                        <td th:text="${session.examinateurName}">-</td>
                        <td>
                            <span th:if="${session.scoreGlobal != null}"
                                  th:text="${session.scoreGlobal + '/100'}"
                                  th:class="${session.scoreGlobal >= 75 ? 'badge bg-success' : (session.scoreGlobal >= 50 ? 'badge bg-warning text-dark' : 'badge bg-danger')}">-</span>
                        </td>
                        <td><span th:if="${session.niveauEstime != null}" class="badge bg-info text-dark" th:text="${session.niveauEstime}">-</span></td>
                        <td>
                            <small th:if="${session.createdAt != null}"
                                   th:text="${#temporals.format(session.createdAt, 'dd/MM/yy HH:mm')}">-</small>
                        </td>
                        <td>
                            <span th:switch="${session.status.name()}">
                                <span th:case="'RAPPORT_GENERE'" class="badge bg-success">Terminé</span>
                                <span th:case="'REPONSES_SOUMISES'" class="badge bg-warning text-dark">Analyse</span>
                                <span th:case="'QUESTIONS_GENEREES'" class="badge bg-info text-dark">En cours</span>
                                <span th:case="*" class="badge bg-secondary">Démarré</span>
                            </span>
                        </td>
                        <td>
                            <a th:if="${session.status.name() == 'RAPPORT_GENERE'}"
                               th:href="@{/evaluation/rapport/{id}(id=${session.id})}"
                               class="btn btn-sm btn-primary me-1" title="Voir rapport">
                                <i class="fas fa-eye"></i>
                            </a>
                            <a th:if="${session.status.name() == 'RAPPORT_GENERE'}"
                               th:href="@{/evaluation/rapport/{id}/pdf(id=${session.id})}"
                               class="btn btn-sm btn-danger" title="Télécharger PDF">
                                <i class="fas fa-file-pdf"></i>
                            </a>
                            <a th:if="${session.status.name() == 'QUESTIONS_GENEREES'}"
                               th:href="@{/evaluation/reponses/{id}(id=${session.id})}"
                               class="btn btn-sm btn-success" title="Saisir réponses">
                                <i class="fas fa-edit"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${sessions.empty}">
                        <td colspan="10" class="text-center text-muted py-5">
                            <i class="fas fa-inbox fa-3x d-block mb-3 opacity-25"></i>
                            Aucune évaluation enregistrée
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</div>
</body>
</html>
