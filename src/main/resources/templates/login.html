<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EvalPro — Connexion</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #003d7a, #0066cc); min-height: 100vh; display: flex; align-items: center; }
        .login-card { border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
        .brand-icon { width: 80px; height: 80px; background: #003d7a; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card login-card border-0">
                <div class="card-body p-5">
                    <div class="brand-icon mb-3">
                        <i class="fas fa-user-check fa-2x text-white"></i>
                    </div>
                    <h3 class="text-center fw-bold mb-1">EvalPro</h3>
                    <p class="text-center text-muted mb-4">Système d'évaluation professionnelle</p>

                    <div th:if="${param.error}" class="alert alert-danger">
                        <i class="fas fa-exclamation-triangle me-2"></i>Identifiants incorrects.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success">
                        <i class="fas fa-check me-2"></i>Déconnexion réussie.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nom d'utilisateur</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                                <input type="text" name="username" class="form-control" required autofocus>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Mot de passe</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100">
                            <i class="fas fa-sign-in-alt me-2"></i>Se connecter
                        </button>
                    </form>
                </div>
            </div>
            <p class="text-center text-white mt-3 opacity-75">
                <small><i class="fas fa-shield-alt me-1"></i>Accès réservé — Usage RH confidentiel</small>
            </p>
        </div>
    </div>
</div>
</body>
</html>
